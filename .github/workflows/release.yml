name: Upload Release Asset
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build
        env:
          CI_BUILD: 'false'

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t jars < <(find versions -path '*/build/libs/*.jar' ! -name '*-sources.jar' | sort)
          echo "Uploading ${#jars[@]} artifacts:"
          printf '%s\n' "${jars[@]}"
          gh release upload "${{ github.event.release.tag_name }}" "${jars[@]}" \
            --repo "${{ github.repository }}" \
            --clobber
