name: CI for Mod
on:
  workflow_dispatch:
  push:
    branches:
      - release/**
      - dev/**
    paths:
      - src/**
      - gradle/**
      - versions/**
      - build.gradle
      - common.gradle
      - gradle.properties
      - settings.gradle
      - settings.json

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: snapshot
      VERSION_TYPE: alpha
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Read Properties
        id: 'properties'
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name java_version'

      - name: Setup Java 25
        uses: actions/setup-java@v3.6.0
        with:
          distribution: zulu
          java-version: 25

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4.3.1

      - name: Build
        run: ./gradlew build
